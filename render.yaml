# Render Blueprint: deploys the API, a PostgreSQL database and a Redis-compatible Key Value
# store with one click (Render dashboard -> New -> Blueprint -> pick this repository).
# See docs/DEPLOY.md for the full walkthrough, including connecting Retell AI.

services:
  - type: web
    name: voice-ai-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: voice-ai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: voice-ai-redis
          property: connectionString
      - key: API_KEYS
        generateValue: true # Random value; copy it from the dashboard to call the API.
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: LOG_FORMAT
        value: json
      - key: BUSINESS_TIMEZONE
        value: America/New_York
      # Secrets you paste in the dashboard after the first deploy (never commit them):
      - key: RETELL_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_ANALYSIS_ENABLED
        value: "false"

  - type: keyvalue
    name: voice-ai-redis
    plan: free
    ipAllowList: [] # Only reachable from services in this Render account.

databases:
  - name: voice-ai-db
    plan: free
